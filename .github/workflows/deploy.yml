name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather than
# cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # No build step: site/ is served as is. This checks the offline file list.
      - name: Check site files
        run: npm run check

      # Each deploy gets its own offline cache, so phones pick up the new version.
      - name: Stamp the offline cache with this commit
        run: |
          sed -i "s/^const VERSION = 'dev';$/const VERSION = '${GITHUB_SHA::12}';/" site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::12}';$" site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
